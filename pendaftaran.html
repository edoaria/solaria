<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Pendaftaran - SOLARIA ROLEPLAY</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Orbitron:wght@600;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#f8fafc] text-slate-800 font-sans min-h-screen">

    <header class="bg-white/90 backdrop-blur-md sticky top-0 z-50 border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-6 py-3 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <img src="assets/img/logo.png" alt="Solaria Logo" class="w-10 h-10 rounded-xl object-cover shadow-sm">
                <div>
                    <h1 class="text-xl font-extrabold tracking-wider text-slate-900 font-['Orbitron'] leading-none">SOLARIA</h1>
                    <p class="text-[10px] text-sky-500 font-bold tracking-widest">ROLEPLAY</p>
                </div>
            </div>

            <nav class="hidden lg:flex items-center gap-2 text-xs font-semibold text-slate-600">
                <a href="index.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-house"></i> Home
                </a>
                <a href="harga.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-tag"></i> Cek Harga
                </a>
                <a href="pendaftaran.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl bg-sky-50 text-sky-500 font-bold">
                    <i class="fa-solid fa-id-card"></i> Whitelist & Badside
                </a>
                <a href="update.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl hover:bg-slate-100 transition-colors">
                    <i class="fa-solid fa-bullhorn"></i> Info Update
                </a>
                <a href="chat.html" class="flex items-center gap-1.5 px-3.5 py-2 rounded-xl hover:bg-slate-100 transition-colors relative">
                    <i class="fa-solid fa-comments"></i> Chat Player
                    <span class="w-2 h-2 rounded-full bg-emerald-500 absolute -top-0.5 -right-0.5"></span>
                </a>
            </nav>

            <div class="flex items-center gap-3">
                <a href="https://cfx.re/join/j44ele4" target="_blank" class="flex items-center gap-2 bg-[#00a6ff] hover:bg-[#0092e0] text-white text-xs font-extrabold px-5 py-2.5 rounded-2xl shadow-md shadow-sky-400/30 transition-all hover:scale-105">
                    <i class="fa-solid fa-gamepad"></i> Connect Server
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-6 py-10 space-y-8">
        <div class="flex justify-between items-center border-b border-slate-200 pb-5">
            <div>
                <h2 class="text-3xl font-black text-slate-900 font-['Orbitron'] flex items-center gap-3">
                    <i class="fa-solid fa-file-pen text-[#00a6ff]"></i> Form Pendaftaran
                </h2>
                <p class="text-slate-500 text-sm mt-1">Daftar Whitelist Player atau Organisasi Badside Solaria Roleplay</p>
            </div>
            <div id="registration-status-badge" class="flex items-center gap-2 px-4 py-2 rounded-full text-xs font-bold bg-emerald-50 text-emerald-600 border border-emerald-200">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                <span id="reg-status-text">PENDAFTARAN OPEN</span>
            </div>
        </div>

        <div class="bg-white border border-slate-200 p-8 rounded-3xl shadow-sm hover-wobble">
            <form id="form-registration" onsubmit="handleRegistration(event)" class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">Nama IC (In Character)</label>
                        <input type="text" required placeholder="Contoh: Alex Ferguson" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#00a6ff]">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 mb-2">Kategori Pendaftaran</label>
                        <select required class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#00a6ff]">
                            <option value="whitelist">Citizen Whitelist</option>
                            <option value="badside">Badside / Gang / Mafia</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">Steam Hex ID</label>
                    <input type="text" required placeholder="Contoh: 1100001abcdef12" class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm font-mono focus:outline-none focus:border-[#00a6ff]">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-2">Alasan Bergabung</label>
                    <textarea rows="4" required placeholder="Jelaskan latar belakang dan rencana karakter Anda..." class="w-full bg-slate-50 border border-slate-200 rounded-2xl px-4 py-3.5 text-sm focus:outline-none focus:border-[#00a6ff]"></textarea>
                </div>
                <button type="submit" id="reg-submit-btn" class="w-full bg-[#00a6ff] hover:bg-[#0082c9] text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-sky-400/30 transition-all text-sm">
                    Kirim Form Pendaftaran
                </button>
            </form>
        </div>
    </main>

    <footer class="border-t border-slate-200 bg-white py-6 mt-16 text-center text-xs text-slate-400">
        <p>&copy; 2026 Solaria Roleplay. All Rights Reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
